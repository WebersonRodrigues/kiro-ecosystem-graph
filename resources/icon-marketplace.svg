<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="16" fill="#0d0d0d"/>
  <!-- Central node -->
  <circle cx="64" cy="64" r="12" fill="#4A9EFF" opacity="0.9"/>
  <!-- Outer nodes -->
  <circle cx="28" cy="28" r="8" fill="#4CAF50" opacity="0.8"/>
  <circle cx="100" cy="28" r="8" fill="#FF9800" opacity="0.8"/>
  <circle cx="28" cy="100" r="8" fill="#9C27B0" opacity="0.8"/>
  <circle cx="100" cy="100" r="8" fill="#FF5722" opacity="0.8"/>
  <circle cx="64" cy="18" r="6" fill="#00BCD4" opacity="0.7"/>
  <circle cx="64" cy="110" r="6" fill="#8BC34A" opacity="0.7"/>
  <circle cx="18" cy="64" r="6" fill="#009688" opacity="0.7"/>
  <circle cx="110" cy="64" r="6" fill="#F44336" opacity="0.7"/>
  <!-- Skill diamond -->
  <rect x="86" cy="64" width="8" height="8" fill="#B388FF" opacity="0.8" transform="rotate(45 90 68)"/>
  <!-- Hook triangle -->
  <polygon points="38,80 32,92 44,92" fill="#64B5F6" opacity="0.8"/>
  <!-- Edges -->
  <line x1="64" y1="64" x2="28" y2="28" stroke="#4A9EFF" stroke-width="1.2" opacity="0.4"/>
  <line x1="64" y1="64" x2="100" y2="28" stroke="#4A9EFF" stroke-width="1.2" opacity="0.4"/>
  <line x1="64" y1="64" x2="28" y2="100" stroke="#4A9EFF" stroke-width="1.2" opacity="0.4"/>
  <line x1="64" y1="64" x2="100" y2="100" stroke="#4A9EFF" stroke-width="1.2" opacity="0.4"/>
  <line x1="64" y1="64" x2="64" y2="18" stroke="#4A9EFF" stroke-width="1" opacity="0.3"/>
  <line x1="64" y1="64" x2="64" y2="110" stroke="#4A9EFF" stroke-width="1" opacity="0.3"/>
  <line x1="64" y1="64" x2="18" y2="64" stroke="#4A9EFF" stroke-width="1" opacity="0.3"/>
  <line x1="64" y1="64" x2="110" y2="64" stroke="#4A9EFF" stroke-width="1" opacity="0.3"/>
  <!-- Cross connections -->
  <line x1="28" y1="28" x2="64" y2="18" stroke="#4A9EFF" stroke-width="0.8" opacity="0.2"/>
  <line x1="100" y1="28" x2="64" y2="18" stroke="#4A9EFF" stroke-width="0.8" opacity="0.2"/>
  <line x1="28" y1="100" x2="64" y2="110" stroke="#4A9EFF" stroke-width="0.8" opacity="0.2"/>
  <line x1="100" y1="100" x2="64" y2="110" stroke="#4A9EFF" stroke-width="0.8" opacity="0.2"/>
  <line x1="28" y1="28" x2="18" y2="64" stroke="#4A9EFF" stroke-width="0.8" opacity="0.2"/>
  <line x1="100" y1="28" x2="110" y2="64" stroke="#4A9EFF" stroke-width="0.8" opacity="0.2"/>
  <!-- Glow effect on central node -->
  <circle cx="64" cy="64" r="18" fill="none" stroke="#4A9EFF" stroke-width="0.5" opacity="0.15"/>
  <circle cx="64" cy="64" r="24" fill="none" stroke="#4A9EFF" stroke-width="0.3" opacity="0.08"/>
</svg>
